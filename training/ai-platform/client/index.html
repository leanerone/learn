<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 工具学习平台 · EAP 工程师专版</title>
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <a class="brand" href="#/dashboard">
    <span class="dot"></span>
    <span class="brand-name">AI 学习平台</span>
    <span class="brand-sub">EAP 工程师专版</span>
  </a>
  <nav class="nav" id="nav">
    <a href="#/dashboard" data-route="dashboard">🏠 首页</a>
    <a href="#/today" data-route="today">📅 今日任务</a>
    <a href="#/course" data-route="course">📖 课程</a>
    <a href="#/slides" data-route="slides">🎞️ PPT 讲义</a>
    <a href="#/skills" data-route="skills">🌳 技能树</a>
    <a href="#/progress" data-route="progress">📊 进度</a>
    <a href="#/resources" data-route="resources">🎬 资源</a>
    <a href="#/notes" data-route="notes">📝 笔记</a>
    <a href="#/quiz" data-route="quiz">✅ 自检</a>
  </nav>
  <div class="user-area">
    <span id="userBadge" class="user-badge"></span>
  </div>
</header>

<!-- 用户首次登录浮层 -->
<div id="loginModal" class="modal hidden">
  <div class="modal-card">
    <h2>👋 欢迎开始 30 天学习之旅</h2>
    <p>给我起个名字,我会一直陪你学完。</p>
    <input id="loginName" placeholder="例如:小赵  /  admin  /  你的英文名" />
    <select id="loginAvatar">
      <option value="🦊">🦊 狐狸</option>
      <option value="🐼">🐼 熊猫</option>
      <option value="🦉">🦉 猫头鹰</option>
      <option value="🐯">🐯 老虎</option>
      <option value="🚀">🚀 火箭</option>
      <option value="⚡">⚡ 闪电</option>
    </select>
    <button id="loginBtn" class="btn-primary">开始学习 →</button>
  </div>
</div>

<!-- 主内容 -->
<main id="app" class="app">
  <div class="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>
</main>

<footer>
  <p>© 2026 AI 学习平台 · 用 Node.js + Express + SQLite · 数据存于 <code>./data/ai-platform.db</code></p>
  <p style="color:var(--text-2);font-size:12px;margin-top:6px;">页面整体已切换为浅色主题,数据文件路径保持不变。</p>
</footer>

<script src="/js/api.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/slides.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
